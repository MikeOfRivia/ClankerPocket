name: Build Chess Station — Waveshare 7-inch

on:
  push:
    branches: [waveshare-chess-mcumax]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Chess Station
        uses: actions/checkout@v4
        with:
          ref: waveshare-chess-mcumax

      - name: Install Arduino CLI and ESP32 board support
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.5.1
          echo "$PWD/bin" >> "$GITHUB_PATH"
          ./bin/arduino-cli config init --overwrite
          ./bin/arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Restore Waveshare touch stack and chess engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/waveshareteam/ESP32-S3-Touch-LCD-7.git upstream
          cd upstream
          git sparse-checkout set examples/Arduino/examples/10_lvgl_v9_demo examples/Arduino/libraries/ESP32_Display_Panel examples/Arduino/libraries/ESP32_IO_Expander examples/Arduino/libraries/esp-lib-utils
          cd ..
          mkdir -p deps sketch/ChessStation
          cp -a upstream/examples/Arduino/libraries/ESP32_Display_Panel deps/
          cp -a upstream/examples/Arduino/libraries/ESP32_IO_Expander deps/
          cp -a upstream/examples/Arduino/libraries/esp-lib-utils deps/
          for f in esp_lv_adapter_arduino.cpp esp_lv_adapter_arduino.h esp_panel_board_custom_conf.h; do
            cp "upstream/examples/Arduino/examples/10_lvgl_v9_demo/$f" sketch/ChessStation/
          done
          cp chess-station/ChessStation.ino sketch/ChessStation/ChessStation.ino
          cp chess-station/ArcadeGames.h sketch/ChessStation/ArcadeGames.h
          git clone --depth 1 https://github.com/Gissio/mcu-max.git engine
          cp engine/src/mcu-max.c engine/src/mcu-max.h sketch/ChessStation/
          python3 chess-station/patch-fen-pawns.py sketch/ChessStation/mcu-max.c
          # Pre-render 12 chess symbols as transparent 44px LVGL image assets.
          # The previous LVGL font path triggered a watchdog in glyph drawing.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core python3-pil
          python3 chess-station/generate-chess-images.py \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            sketch/ChessStation/chess_piece_images.cpp
          grep -q 'chess_piece_images' sketch/ChessStation/chess_piece_images.cpp
          python3 chess-station/pack-photo-assets.py chess-station/assets sketch/ChessStation/treasure_images.cpp
          git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git deps/lvgl
          find deps/lvgl -name '*.S' -type f -delete
          cp deps/lvgl/lv_conf_template.h deps/lv_conf.h
          sed -i 's/^#if 0 \/\* Set this to "1" to enable content \*\//#if 1 \/\* Set this to "1" to enable content \*\//' deps/lv_conf.h
          sed -i 's/^#define LV_FONT_MONTSERRAT_24 0/#define LV_FONT_MONTSERRAT_24 1/' deps/lv_conf.h
          sed -i 's/^#define LV_FONT_MONTSERRAT_28 0/#define LV_FONT_MONTSERRAT_28 1/' deps/lv_conf.h
          sed -i 's/^#define LV_USE_TJPGD 0/#define LV_USE_TJPGD 1/' deps/lv_conf.h
          sed -i 's/^#define LV_USE_FS_MEMFS 0/#define LV_USE_FS_MEMFS 1/' deps/lv_conf.h
          sed -i "s/#define LV_FS_MEMFS_LETTER .*/#define LV_FS_MEMFS_LETTER 'M'/" deps/lv_conf.h
          grep -q "LV_FS_MEMFS_LETTER 'M'" deps/lv_conf.h
          grep -q '^#define LV_USE_TJPGD 1' deps/lv_conf.h
          grep -q '^#define LV_USE_FS_MEMFS 1' deps/lv_conf.h
          grep -q '^#define ESP_OPEN_TOUCH 1' sketch/ChessStation/esp_panel_board_custom_conf.h

      - name: Compile Chess Station
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,LoopCore=0' \
            --libraries "$PWD/deps" \
            --build-path "$PWD/build" \
            --output-dir "$PWD/firmware" \
            sketch/ChessStation

      - name: Decode graphics watchdog backtrace
        shell: bash
        run: |
          set -euxo pipefail
          find "$HOME/.arduino15/packages/esp32" -name '*addr2line' -type f
          ADDR2LINE=$(find "$HOME/.arduino15/packages/esp32" -name 'xtensa-esp32s3-elf-addr2line' -type f | head -1)
          test -n "$ADDR2LINE"
          "$ADDR2LINE" -pfiaC -e build/ChessStation.ino.elf \
            0x4202492d 0x42014251 0x4201483d 0x4202538b 0x420219ce \
            0x4201342b 0x42013470 0x420134e5 0x42014667 0x42038c82 \
            0x42065ced 0x4200d3af 0x4200d4b2 0x42011d7b 0x420119bb \
            0x42011e22 0x420119bb 0x42011e22 0x420119bb 0x42012016 \
            0x42012119 0x420121bc 0x4201286d 0x4202f8ce 0x420023dc \
            0x4037c46d

      - name: Merge and package COM3 firmware
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user 'esptool==5.3.1'
          python3 -m esptool --chip esp32s3 merge-bin \
            -o firmware/chess-station-full.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 firmware/ChessStation.ino.bootloader.bin \
            0x8000 firmware/ChessStation.ino.partitions.bin \
            0x10000 firmware/ChessStation.ino.bin
          cat > firmware/flash.ps1 <<'PS1'
          param([string]$Port = 'COM3')
          $ErrorActionPreference = 'Stop'
          Set-Location $PSScriptRoot
          py -m esptool --chip esp32s3 --port $Port --baud 460800 write-flash 0x0 .\chess-station-full.bin
          if ($LASTEXITCODE -ne 0) { throw 'Flash failed. Try BOOT + RESET, then retry.' }
          Write-Host 'Chess Station flashed. Press RESET to start.' -ForegroundColor Green
          PS1
          cat > firmware/README.txt <<'EOF'
          KNIGHT FAMILY GAME TREASURES - Waveshare ESP32-S3-Touch-LCD-7
          Extract this ZIP, open PowerShell in the folder, then:
            Set-ExecutionPolicy -Scope Process Bypass -Force
            .\flash.ps1 -Port COM3
          Press RESET after flashing.
          Includes mcu-max chess engine (MIT license).
          Onboard AI, two-player mode, 4 difficulty levels, undo, legal moves.
          Wooden chest launcher, wooden game trays, Bang Bot, seven games.
          MVP limitation: engine defaults to queen promotion (no underpromotion).
          No local compilation required.
          EOF
          cp engine/LICENSE firmware/MCU-MAX-LICENSE.txt

      - name: Upload ready-to-flash Chess Station
        uses: actions/upload-artifact@v4
        with:
          name: ChessStation-COM3-Flash
          path: |
            firmware/chess-station-full.bin
            firmware/flash.ps1
            firmware/README.txt
            firmware/MCU-MAX-LICENSE.txt
          if-no-files-found: error
