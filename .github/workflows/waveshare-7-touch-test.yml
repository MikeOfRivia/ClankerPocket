name: Waveshare 7 Touch Baseline (Official Demo)

on:
  push:
    branches: [waveshare-7-touch-baseline]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.5.1
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Fetch official Waveshare demo and its libraries
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/waveshareteam/ESP32-S3-Touch-LCD-7.git upstream
          cd upstream
          git sparse-checkout set examples/Arduino/examples/10_lvgl_v9_demo examples/Arduino/libraries/ESP32_Display_Panel examples/Arduino/libraries/ESP32_IO_Expander examples/Arduino/libraries/esp-lib-utils
          cd ..
          mkdir -p deps sketch
          cp -a upstream/examples/Arduino/libraries/ESP32_Display_Panel deps/
          cp -a upstream/examples/Arduino/libraries/ESP32_IO_Expander deps/
          cp -a upstream/examples/Arduino/libraries/esp-lib-utils deps/
          cp -a upstream/examples/Arduino/examples/10_lvgl_v9_demo sketch/

          git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git deps/lvgl
          # Non-Xtensa optimized assembly backends aren't needed by the demo.
          find deps/lvgl -name '*.S' -type f -delete
          cp deps/lvgl/lv_conf_template.h deps/lv_conf.h
          sed -i 's/^#if 0 \/\* Set this to "1" to enable content \*\//#if 1 \/\* Set this to "1" to enable content \*\//' deps/lv_conf.h
          sed -i -E 's/^#define LV_USE_DEMO_WIDGETS[[:space:]]+0/#define LV_USE_DEMO_WIDGETS 1/' deps/lv_conf.h
          grep -Eq '^[[:space:]]*#define LV_USE_DEMO_WIDGETS 1' deps/lv_conf.h
          grep -q '^#define ESP_OPEN_TOUCH 1' sketch/10_lvgl_v9_demo/esp_panel_board_custom_conf.h
          echo 'Official Waveshare touch is enabled.'

      - name: Compile unmodified official LVGL Widgets touch demo
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=default,PSRAM=opi,LoopCore=0' \
            --libraries "$PWD/deps" \
            --build-path "$PWD/build" \
            --output-dir "$PWD/firmware" \
            --warnings default \
            sketch/10_lvgl_v9_demo

      - name: Generate single-file flash image
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah firmware
          python3 -m pip install --user 'esptool==5.3.1'
          python3 -m esptool --chip esp32s3 merge-bin \
            -o firmware/waveshare-touch-test-full.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 firmware/10_lvgl_v9_demo.ino.bootloader.bin \
            0x8000 firmware/10_lvgl_v9_demo.ino.partitions.bin \
            0x10000 firmware/10_lvgl_v9_demo.ino.bin

      - name: Package with instructions
        shell: bash
        run: |
          cat > firmware/FLASH-COM6.txt <<'EOF'
          Official Waveshare LCD-7 touch baseline. This is NOT Shape Siege.
          Requires esptool on your Windows PC.
          From PowerShell with a bootloader-ready board on COM6:
          py -m esptool --chip esp32s3 --port COM6 --baud 460800 write-flash 0x0 .\waveshare-touch-test-full.bin

          Tap buttons and drag sliders on the LVGL Widgets demo.
          This full flash image replaces firmware and may overwrite settings.
          EOF
          cat > firmware/SOURCE.txt <<'EOF'
          Unmodified Waveshare 10_lvgl_v9_demo example
          https://github.com/waveshareteam/ESP32-S3-Touch-LCD-7
          Arduino ESP32 3.3.12, LVGL 9.5.0
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: waveshare-7-official-touch-test
          path: firmware/
          if-no-files-found: error
