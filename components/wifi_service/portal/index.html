<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clanker Pocket Setup</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 16px;color:#222}
h1{margin-bottom:4px}button,input,select{font:inherit;padding:10px;margin:6px 0}
button{cursor:pointer}select,input{width:100%;box-sizing:border-box}
#msg{margin:12px 0;white-space:pre-wrap}.row{display:flex;gap:8px}.row button{flex:1}
small{color:#666}
</style>
</head>
<body>
<h1>Clanker Pocket Setup</h1>
<small id="state">Checking device...</small>
<h2>Wi-Fi</h2>
<div class="row"><button id="scan">Scan Networks</button><button id="refresh">Refresh Status</button></div>
<select id="net"><option value="">Select network</option></select>
<input id="pass" type="password" placeholder="Wi-Fi password">
<button id="connect">Connect</button>
<h2>Clanker Pocket</h2>
<small id="aiState">Checking OpenAI configuration...</small>
<input id="openaiKey" type="password" autocomplete="off" placeholder="OpenAI API key">
<button id="saveOpenAI">Save OpenAI Key</button>
<div id="msg"></div>
<script>
const $=id=>document.getElementById(id);
async function api(path,opt){
  const r=await fetch(path,{cache:"no-store",...opt,headers:{"Content-Type":"application/json",...(opt&&opt.headers||{})}});
  const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch(e){throw Error("Bad response: "+t.slice(0,80))}
  if(!r.ok||j.success===false) throw Error(j.message||("HTTP "+r.status)); return j;
}
function show(s){$("msg").textContent=s}
async function status(){
  try{
    const j=await api("/api/status");
    $("state").textContent=j.connected?("Connected to "+j.ssid+" — "+j.ip_address):("Setup AP: "+j.ap_ssid);
    return j;
  }catch(e){show("Status failed: "+e.message)}
}
async function scan(){
  show("Scanning...");
  try{
    for(let i=0;i<20;i++){
      const j=await api("/api/scan");
      if(!j.scan_in_progress){
        const n=Array.isArray(j.networks)?j.networks:[];
        $("net").innerHTML='<option value="">Select network</option>'+n.map(x=>'<option></option>').join("");
        [...$("net").options].slice(1).forEach((o,i)=>{o.value=n[i].ssid;o.textContent=n[i].ssid+(n[i].is_open?"":" 🔒")});
        show(n.length?("Found "+n.length+" networks"):"No networks found"); return;
      }
      await new Promise(r=>setTimeout(r,750));
    }
    show("Scan timed out");
  }catch(e){show("Scan failed: "+e.message)}
}
async function openaiStatus(){
  try{
    const j=await api("/api/settings/openai");
    $("aiState").textContent=j.configured?("OpenAI key configured ••••"+j.last4):"OpenAI key not configured";
    return j;
  }catch(e){$("aiState").textContent="OpenAI status unavailable"}
}
async function saveOpenAI(){
  const key=$("openaiKey").value.trim();
  if(!key){show("Enter an OpenAI API key first.");return}
  show("Saving OpenAI key...");
  try{
    const j=await api("/api/settings/openai",{method:"POST",body:JSON.stringify({api_key:key})});
    $("openaiKey").value="";
    $("aiState").textContent="OpenAI key configured ••••"+(j.last4||"");
    show("OpenAI key saved.");
  }catch(e){show("OpenAI save failed: "+e.message)}
}
async function connect(){
  const ssid=$("net").value;if(!ssid){show("Select a network first");return}
  show("Connecting to "+ssid+"...");
  try{
    await api("/api/configure",{method:"POST",body:JSON.stringify({ssid,password:$("pass").value})});
    for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,1000));const j=await status();if(j&&j.connected){show("Connected. You can leave this page.");return}}
    show("Connection still in progress.");
  }catch(e){show("Connect failed: "+e.message)}
}
$("scan").onclick=scan;$("connect").onclick=connect;$("refresh").onclick=status;$("saveOpenAI").onclick=saveOpenAI;status();openaiStatus();
</script>
</body>
</html>
